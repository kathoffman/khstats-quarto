project:
  type: website

website:
  title: "khstats."
  favicon: img/climbing_comic.jpg
  image: img/climbing-route-overlay.png
  twitter-card:
    image: img/climbing-route-overlay.png
    card-style: summary
  open-graph: true
  page-navigation: true
  google-analytics: "UA-136820093-1"
  site-url: "https://www.khstats.com"
  
  search:
    location: navbar
    type: overlay

  navbar:
    left:
      - text: "about"
        href: about.qmd
      - text: "research"
        menu:
          - text: "Selected Publications"
            icon: journal-text
            href: publications.qmd
          - text: "Talks"
            icon: easel
            href: talks.qmd
          - text: "Google Scholar"
            icon: mortarboard
            href: https://scholar.google.com/citations?hl=en&user=73RvTUoAAAAJ
      - sidebar:art
      - text: "writing"
        file: blog.qmd

    right:
      - text: "CV"
        file: static/KatherineHoffman_CV_Feb2026_v2.pdf
      - icon: github
        href: https://github.com/kathoffman
      - icon: linkedin
        href: https://www.linkedin.com/in/katherinelhoffman/
        aria-label: LinkedIn
      - icon: bluesky
        href: https://bsky.app/profile/kathoffman.bsky.social
      - icon: envelope
        href: mailto:kathoffman.stats@gmail.com

  sidebar:
    - id: art
      collapse-level: 1
      title: "illustrations"
      style: "docked"
      contents:
        - text: "Visual Guides for Causal Inference"
          file: art/illustrations_viz.qmd
        - text: "Educational Drawings and Comics"
          file: art/illustrations_draw.qmd
format:
  html:
    smooth-scroll: true
    theme: [default, theme.scss]
    highlight-style: github
    link-external-icon: false
    link-external-newwindow: true
    citations-hover: true
    footnotes-hover: true
    anchor-sections: true
    code-link: false
    code-block-bg: "#f1f3f5"
    code-block-border-left: "#31BAE9"
    reference-location: margin
    fig-cap-location: margin
    grid:
      body-width: 850px
      margin-width: 300px

editor: source

